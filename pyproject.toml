[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-strategy"
version = "0.1.0"
description = "Canonical engine-neutral DCA and Grid strategy foundation"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
include = ["trading_strategy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
