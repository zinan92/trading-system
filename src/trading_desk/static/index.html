<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Park 交易台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">Park 交易台</div>
  <div class="assets" role="group" aria-label="品种">
    <button type="button" data-asset="BTC" aria-pressed="true">BTC</button>
    <button type="button" data-asset="XAU" aria-pressed="false">黄金</button>
  </div>
  <ol class="steps" id="steps" aria-label="今天的流程"></ol>
  <div class="ticker">
    <div><div class="lbl" id="venue"></div><div class="px num" id="px">—</div></div>
    <div><div class="lbl">今日（北京时间 8 点起）</div><div class="num" id="chg">—</div></div>
  </div>
</header>

<section class="accts" id="accts" aria-label="持仓盈亏"></section>

<main class="desk">
  <section class="panel col-news" aria-labelledby="h-news">
    <div class="ph"><h2 id="h-news">今天的新闻</h2>
      <div class="seg" role="group" aria-label="新闻筛选">
        <button type="button" data-f="key" aria-pressed="true">重要+关注</button><button type="button" data-f="all" aria-pressed="false">全部</button>
      </div>
    </div>
    <div class="ph" style="padding-top:0"><span class="meta">点一条，引用到你的判断里</span><span class="meta">Intel 分级</span></div>
    <ul class="news" id="news"><li class="empty">正在读取新闻…</li></ul>
  </section>

  <section class="panel col-chart" aria-labelledby="h-chart">
    <div class="ph"><h2 id="h-chart">K 线 · 你的网格</h2>
      <div class="seg" role="group" aria-label="周期">
        <button type="button" data-tf="1h" aria-pressed="false">1 小时</button><button type="button" data-tf="4h" aria-pressed="true">4 小时</button><button type="button" data-tf="1d" aria-pressed="false">日线</button>
      </div>
    </div>
    <div class="chart-wrap"><svg id="chart" viewBox="0 0 760 420" width="100%" role="img" aria-label="K 线与网格价位"></svg></div>
    <div class="chart-src" id="chart-src"></div>
    <div class="legend" id="legend"></div>
    <div class="status" id="status"></div>
  </section>

  <section class="panel col-judge" aria-labelledby="h-judge">
    <div class="ph"><h2 id="h-judge">你的判断</h2><span class="meta" id="today"></span></div>
    <div class="form">
      <div class="dir" role="group" aria-label="方向">
        <button type="button" data-d="long" aria-pressed="false">做多</button>
        <button type="button" data-d="flat" aria-pressed="false">观望</button>
        <button type="button" data-d="short" aria-pressed="false">做空</button>
      </div>
      <label class="f" for="reason">一句理由
        <textarea id="reason" placeholder="你为什么这么判断？比如：美联储可能加息，ETF 转为净流出，先不追多"></textarea>
      </label>
      <label class="f" for="conf">信心 <input id="conf" type="range" min="1" max="5" value="3"></label>
      <div class="conf"><span>没把握</span><span id="confv">3 / 5</span><span>很确定</span></div>
      <div class="f">引用的新闻<div class="cites" id="cites"><em>还没有引用</em></div></div>
    </div>
    <div class="plan" id="plan"><div class="empty" style="padding:0">先选一个方向，系统按它生成计划。</div></div>
    <div class="ph" style="padding-top:4px"><h2 style="font-size:14px">随手记</h2><span class="meta">看盘时的零碎想法</span></div>
    <div class="notes">
      <form id="note-form"><input id="note" placeholder="比如：4 小时线三次试 78,000 没过" autocomplete="off"><button type="submit">记下</button></form>
      <ul id="notes"></ul>
    </div>
  </section>
</main>

<section class="panel review" aria-labelledby="h-review">
  <div class="ph"><h2 id="h-review">复盘 · 你的判断准不准</h2><span class="summary" id="review-summary"></span></div>
  <div class="scroll"><table>
    <thead><tr><th>时间</th><th>品种</th><th>判断</th><th>信心</th><th>理由</th><th>批准</th><th class="num">当时价</th><th class="num">到期价</th><th>结果</th></tr></thead>
    <tbody id="review"></tbody>
  </table></div>
</section>
<script src="/static/app.js"></script>
</body>
</html>
