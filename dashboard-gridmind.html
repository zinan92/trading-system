  <!--
    GridMind 视觉版：以下样式块是本页与生产控制台唯一的差异。
    上面到这里为止的 HTML 结构、<script> 逻辑与原 dashboard-dualtrack-split.html 逐字节相同——
    没有删除或重写任何卡片、输入框、按钮或数据绑定。这里只重新定义配色 token（--bg/--panel/--ink/
    --gold/--run/--block/--human/--machine 等）并追加少量纯视觉的加强规则；因为原页面几乎所有颜色
    都已经通过这些 token 变量引用，重定义 token 就能让下面的每一条原有 CSS 规则自动换色，不需要
    改动它们本身。
  -->
  <style>
    :root{
      --bg:#0a0d14; --panel:#10141f; --panel2:#171c2a;
      --ink:#e9ecf5; --muted:#9aa3b8; --faint:#5d6478;
      --gold:#f0b429; --warn:#e0a63a;
      --run:#2fbf71; --block:#f6465d;
      --human:#4f8ef7; --machine:#f0b429;
      --rule:rgba(233,236,245,.08); --rule-strong:rgba(233,236,245,.18);
    }
    body{
      background:
        radial-gradient(1100px 480px at 78% -12%, rgba(240,180,41,.05), transparent 60%),
        radial-gradient(900px 460px at 8% 108%, rgba(79,142,247,.05), transparent 60%),
        var(--shell);
    }
    .card{box-shadow:0 2px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.02)}
    .metric strong{letter-spacing:-.01em}
    .brand span{color:var(--gold)}
    .top-status.ok::before,.pill.ok::before{text-shadow:0 0 8px color-mix(in srgb,var(--run) 60%,transparent)}
    /* 网格方向：按方向语义着色（做多=green / 做空=red / 中性=amber），风格仍用 --violet(=human, 蓝) 区分维度 */
    .choice[data-direction="long"].on{border-color:var(--run);box-shadow:inset 0 0 0 1px var(--run);background:color-mix(in srgb,var(--run) 13%,var(--panel2));color:var(--ink)}
    .choice[data-direction="short"].on{border-color:var(--block);box-shadow:inset 0 0 0 1px var(--block);background:color-mix(in srgb,var(--block) 13%,var(--panel2));color:var(--ink)}
    .choice[data-direction="neutral"].on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:color-mix(in srgb,var(--gold) 11%,var(--panel2));color:var(--ink)}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:99px}

    /* GRIDMIND production skin: compact, terminal-like, data first. */
    :root{--gm-bg:#090c13;--gm-panel:#10141f;--gm-panel-2:#171c2a;--gm-panel-3:#1f2637;--gm-line:#242c40;--gm-text:#e9ecf5;--gm-muted:#9aa3b8;--gm-faint:#626b82;--gm-amber:#f0b429;--gm-green:#2fbf71;--gm-red:#f6465d;--gm-blue:#4f8ef7}
    body{min-height:100vh;background:radial-gradient(1100px 480px at 78% -10%,rgba(240,180,41,.055),transparent 60%),radial-gradient(800px 460px at 8% 108%,rgba(79,142,247,.05),transparent 60%),var(--gm-bg);color:var(--gm-text);font-size:12px;line-height:1.45}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PUBLIC_OBSERVER=!['127.0.0.1','localhost','::1'].includes(location.hostname);
const ACCESS_CONTROLLED=()=>!PUBLIC_OBSERVER||state.auth?.can_control===true;
const esc=v=>String(v??"--").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v).toLocaleString("en-US",{maximumFractionDigits:2}):"--";
const signed=v=>{const x=Number(v);return Number.isFinite(x)?`${x>0?"+":""}${num(x)}`:"--"};
const pnlClass=v=>Number(v)>0?"pos":Number(v)<0?"neg":"";
const DIR={range:"震荡 · 中性",range_long_bias:"震荡 · 偏多",range_short_bias:"震荡 · 偏空",long:"做多",short:"做空",neutral:"中性",flat:"观望"};
const RUNTIME={stopped:"已停止",starting:"启动中",running:"运行中",replanning:"调整网格中",stopping:"停止中",error:"运行异常"};

const ACCESS_REAUTH_KEY="goldbot-access-reauth";
function apiFailure(message,status=0,code=""){const error=Error(message);error.status=status;error.code=code;return error}
async function api(url,opts={}){
  const headers=new Headers(opts.headers||{});
  headers.set("Accept","application/json");
  headers.set("X-Requested-With","XMLHttpRequest");
  const response=await fetch(url,{...opts,headers,credentials:"same-origin"});
  const contentType=(response.headers.get("content-type")||"").toLowerCase();
  const text=await response.text();
  const accessLoginHtml=PUBLIC_OBSERVER&&contentType.includes("text/html")&&(/Cloudflare Access/i.test(text)||/<title>\s*Sign in/i.test(text));
  if(response.status===401||accessLoginHtml){
    if(PUBLIC_OBSERVER&&sessionStorage.getItem(ACCESS_REAUTH_KEY)!=="1"){
      sessionStorage.setItem(ACCESS_REAUTH_KEY,"1");
      setTimeout(()=>location.reload(),80);
    }
    throw apiFailure("登录会话已过期，正在重新登录……",401,"access_session_expired");
  }
  let body={};
  if(text){
    if(!contentType.includes("application/json"))throw apiFailure(`服务暂时返回了网页而不是数据（HTTP ${response.status}），请刷新后重试。`,response.status,"unexpected_content_type");
    try{body=JSON.parse(text)}catch(_error){throw apiFailure("服务返回的数据格式异常，请刷新后重试。",response.status,"invalid_json");}
  }
  if(response.ok&&PUBLIC_OBSERVER)sessionStorage.removeItem(ACCESS_REAUTH_KEY);
  if(!response.ok)throw apiFailure(body.message||body.error||`请求失败（HTTP ${response.status}）`,response.status,body.error||"http_error");
  return body;
}
function isFresh(m){return m?.trusted===true}
function isTrustedHeaderMarket(m){return isFresh(m)&&m?.timeframe==="1m"}
function statusText(m){return isFresh(m)?"实时·可信":"异常·停止新开仓"}
function finiteNumber(value){return value!==null&&value!==""&&Number.isFinite(Number(value))?Number(value):null}
function displayTradingPair(market){const raw=String(market?.provider_symbol||"").toUpperCase().replace(/\s+/g,"");if(!raw)return"--";if(raw.includes("/"))return raw.split("/").filter(Boolean).join(" / ");for(const quote of ["USDT","USDC","USD","BTC","ETH"]){if(raw.endsWith(quote)&&raw.length>quote.length)return`${raw.slice(0,-quote.length)} / ${quote}`}return raw}

$("#closeAiReceipt").addEventListener("click",()=>$("#aiReceiptDialog").close());
$("#aiReceiptHistory").addEventListener("change",event=>{const row=aiEvaluations(state.data).find(item=>item.evaluation_receipt?.evaluation_id===event.target.value);if(row)renderAiReceipt(row)});
$("#aiReceiptDialog").addEventListener("click",event=>{if(event.target===$("#aiReceiptDialog"))$("#aiReceiptDialog").close()});
$("#directionChoices").addEventListener("click",event=>{const button=event.target.closest("[data-direction]");if(!button)return;state.direction=button.dataset.direction;setChoice("#directionChoices","direction",state.direction);requestPreview({useInputs:false}).catch(()=>{})});
$("#styleChoices").addEventListener("click",event=>{const button=event.target.closest("[data-style]");if(!button)return;state.style=button.dataset.style;setChoice("#styleChoices","style",state.style);requestPreview({useInputs:false}).catch(()=>{})});
$("#gridModeChoices").addEventListener("click",event=>{const button=event.target.closest("[data-grid-mode]");if(!button)return;const previousMode=state.gridMode;state.gridMode=button.dataset.gridMode;setGridMode(state.gridMode);requestPreview({useInputs:false}).catch(()=>{state.gridMode=previousMode;setGridMode(previousMode);redrawChart()})});
$("#smartFill").addEventListener("click",()=>requestPreview({useInputs:false}).catch(()=>{}));
["#rangeLow","#rangeHigh","#gridCount","#leverage","#outOfRange"].forEach(selector=>$(selector).addEventListener("input",schedulePreview));
$("#gridNotional").addEventListener("input",event=>{if(String(event.target.value).trim()){state.notionalMode="manual"}else{state.notionalMode="auto"}schedulePreview()});
$("#showEma").addEventListener("change",event=>{state.indicators.ema=event.target.checked;redrawChart()});$("#showMacd").addEventListener("change",event=>{state.indicators.macd=event.target.checked;redrawChart()});
["#emaFast","#emaSlow"].forEach((selector,index)=>$(selector).addEventListener("change",event=>{const value=Math.round(Number(event.target.value));if(!Number.isInteger(value)||value<2||value>300){event.target.value=state.indicators[index?"slow":"fast"];return}state.indicators[index?"slow":"fast"]=value;if(state.indicators.fast>=state.indicators.slow){state.indicators.slow=state.indicators.fast+1;$("#emaSlow").value=state.indicators.slow}redrawChart()}));
$("#startRobot").addEventListener("click",event=>runButton(event.currentTarget,"正在启动机器人",async()=>{if(!state.preview)await requestPreview({useInputs:false});let result;try{result=await control('start',strategyPayload(),{reload:false})}catch(error){result=await reconcileControlOutcome('start',error)}const startedNotional=result.preview?.grid?.notional_per_grid,orders=result.reconciled?`控制面已确认完整网格启动；当前 ${result.accepted_orders||0} 笔委托仍被接受`:`创建 ${result.created_orders||0} 笔网格委托；当前接受 ${result.accepted_orders||0} 笔、已成交 ${result.filled_orders||0} 笔`;state.preview=null;state.formDirty=false;setNotice(`机器人已启动：生产计划 v${result.plan?.version||"--"}，${orders}${Number.isFinite(Number(startedNotional))?`，每格 ${num(startedNotional)} USD（启动时安全上限）`:""}。`);await load()}));
$("#stopRobot").addEventListener("click",event=>runButton(event.currentTarget,"正在停止、撤单并平仓",async()=>{let result;try{result=await control('stop',{}, {reload:false})}catch(error){result=await reconcileControlOutcome('stop',error)}state.preview=null;state.formDirty=false;setNotice(`${result.reconciled?"连接中断后已核对：":""}机器人已停止：${result.reconciled?"挂单与持仓均为 0":"撤销 "+(result.cancelled_orders||0)+" 笔挂单，平仓 "+(result.flattened_positions||0)+" 笔"}，对账通过。`);await load()}));
$("#applyAdjustment").addEventListener("click",event=>runButton(event.currentTarget,"正在应用新网格区间",async()=>{$("#rangeLow").value=$("#adjustLow").value;$("#rangeHigh").value=$("#adjustHigh").value;await requestPreview({useInputs:true});const result=await control('adjust_plan',strategyPayload(),{reload:false});state.preview=null;state.formDirty=false;setNotice(`网格已调整：生产计划 v${result.plan?.version||"--"}，撤销 ${result.cancelled_orders||0} 笔，重新挂出 ${result.created_orders||0} 笔。`);await load()}));
$("#resetStats").addEventListener("click",event=>runButton(event.currentTarget,"正在重置统计显示",async()=>{await control('reset_statistics',{}, {reload:false});setNotice("已创建新的统计显示基线；持仓和挂单未改变。");await load()}));
$("#positions").addEventListener("click",async event=>{const button=event.target.closest("[data-close]");if(!button)return;try{const data=state.data,positionSide=button.dataset.side,exitSide=["buy","long"].includes(positionSide)?"sell":"buy";setNotice("正在提交手动平仓。");await api('/api/dualtrack/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cycle_id:data.cycle.cycle_id,trade_id:button.dataset.close,side:exitSide,event:'exit',order_type:'market',source:'strategy_production_console'})});setNotice("手动平仓已提交。");await load()}catch(error){setNotice(`平仓未完成：${error.message}`)}});
$("#tabs").addEventListener("click",event=>{const button=event.target.closest("[data-tab]");if(!button)return;$("#tabs .on").classList.remove("on");$(".tab.on").classList.remove("on");button.classList.add("on");$(`[data-panel="${button.dataset.tab}"]`).classList.add("on")});
load();setInterval(()=>{if(!state.busy&&!document.hidden)load()},5000);
</script>
</body></html>
