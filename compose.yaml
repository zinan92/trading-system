# `docker compose up --build` → http://127.0.0.1:8790/trade (#1343)
# Ports are published on the host's loopback only: nothing is reachable from the network.
services:
  trading:
    build:
      context: .
      args:
        WITH_NAUTILUS: "${WITH_NAUTILUS:-0}"
    image: trading-system:local
    ports:
      - "127.0.0.1:8790:8790"   # 交易台 /trade, /desk
      - "127.0.0.1:8765:8765"   # GridMind console
    environment:
      # Market data: zinan92/datafeed on the host. Absent → the chart says so and new entries stay
      # blocked; no other source stands in.
      TRADING_ORCHESTRATOR_DATAFEED_URL: "${DATAFEED_URL:-http://host.docker.internal:8100}"
      TRADING_DESK_DATAFEED_URL: "${DATAFEED_URL:-http://host.docker.internal:8100}"
      # Optional news rail (any service answering /api/news). Absent → "no source".
      TRADING_DESK_INTEL_URL: "${INTEL_URL:-http://host.docker.internal:8001}"
      TRADING_DESK_HL_ACCOUNT: "${HYPERLIQUID_TESTNET_ACCOUNT_ADDRESS:-}"
      HYPERLIQUID_TESTNET_ACCOUNT_ADDRESS: "${HYPERLIQUID_TESTNET_ACCOUNT_ADDRESS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - trading-data:/data   # receipts, ledgers, read models, desk.db
    restart: unless-stopped

volumes:
  trading-data:
