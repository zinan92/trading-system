{
  "kline_base_url": "local_gold_api",
  "intel_base_url": "http://localhost:8001",
  "output_root": "outputs",
  "local_market_db": "data/market_data.db",
  "datafeed": {
    "enabled": true,
    "base_url": "http://127.0.0.1:8100",
    "source": "binance_usdm_futures",
    "asset_class": "commodity",
    "market_data_contract_mode": "authoritative",
    "timeout_seconds": 10,
    "instrument_routes": {
      "GOLD": {
        "asset_class": "commodity",
        "ticker": "GOLD",
        "source": "binance_usdm_futures",
        "require_execution_venue": true
      },
      "MGCmain": {
        "asset_class": "commodity",
        "ticker": "MGCmain",
        "source": "tiger_openapi_comex",
        "require_execution_venue": true
      },
      "DXY": {
        "asset_class": "macro",
        "ticker": "DXY",
        "source": "fred_public_csv_macro",
        "cache_policy": "allow"
      },
      "US10Y_REAL": {
        "asset_class": "macro",
        "ticker": "US10Y_REAL",
        "source": "fred_public_csv_macro",
        "cache_policy": "allow"
      },
      "GLD_FLOW": {
        "asset_class": "flow",
        "ticker": "GLD_FLOW",
        "source": "fred_public_csv_flow",
        "cache_policy": "allow"
      },
      "FED_CPI_EVENTS": {
        "asset_class": "event",
        "ticker": "FED_CPI_EVENTS",
        "source": "fred_public_csv_event",
        "cache_policy": "allow"
      }
    }
  },
  "copilot_base_url": "http://localhost:8200",
  "backtest_base_url": "http://localhost:8300",
  "backtest_plugins": {
    "signal": "local_signal",
    "historical_strategy": "event_driven_strategy"
  },
  "timeframes": ["5m"],
  "factor_timeframes": ["1d"],
  "signal_lookback_bars": 240,
  "backtest_lookback_bars": 1000,
  "chart_display_bars": 3500,
  "data_quality_gate": {
    "enabled": true,
    "min_clean_rows": 200,
    "max_missing_ratio": 0.05,
    "max_synthetic_ratio": 0.20,
    "max_spike_flags": 0
  },
  "execution_mode": "paper",
  "live_trading_enabled": false,
  "paper_account": {
    "starting_equity": 10000,
    "max_allowed_leverage": 5,
    "base_currency": "USD",
    "default_ticker": "XAU"
  },
  "broker": {
    "provider": "binance_usdm",
    "dry_run": true,
    "environment": "demo",
    "base_url": "https://demo-fapi.binance.com",
    "api_key_env": "BINANCE_API_KEY",
    "api_secret_env": "BINANCE_API_SECRET",
    "allowed_symbols": ["GOLD", "XAUUSD"],
    "instrument_map": {
      "GOLD": "XAUUSDT",
      "XAUUSD": "XAUUSDT"
    },
    "request_dir": "live_order_requests",
    "outbox_dir": "data/broker_outbox/mt5",
    "inbox_dir": "data/broker_inbox/mt5",
    "receipt_pattern": "*.json"
  },
  "fallback_to_mock": false,
  "intel_fallback_to_mock": true,
  "analysis_fallback_to_mock": true,
  "allow_synthetic_seed": true,
  "_note_allow_public_snapshot_bar_for_paper": "DEPRECATED / no-op. gold-api/env spot snapshots are now always stored as quotes only, never written to the bars table as degenerate candles (see services/kline_client._fetch_local_gold_5m). This flag is still accepted for backward compatibility but no longer changes behavior.",
  "allow_public_snapshot_bar_for_paper": true,
  "gold_5m_backfill": {
    "enabled": true,
    "provider": "yahoo_chart",
    "yahoo_symbol": "GC=F",
    "range": "5d",
    "min_non_seed_rows": 240
  },
  "market_data_sources": {
    "gold_5m": {
      "public_providers": ["gold-api.com", "yahoo_chart:GC=F", "binance_usdm"],
      "execution_venue_providers": ["binance_usdm"],
      "official_broker_providers": ["broker_csv", "mt5_csv", "ibkr", "oanda"],
      "require_official_for_live": false,
      "allow_execution_venue_for_live": true,
      "max_live_bar_lag_minutes": 15,
      "max_public_quote_age_minutes": 15,
      "price_sanity": {
        "enabled": true,
        "min_price": 3000,
        "max_price": 6000,
        "max_quote_bar_deviation_pct": 3
      }
    },
    "mgcmain_1m": {
      "public_providers": [],
      "execution_venue_providers": ["tiger_openapi:COMEX"],
      "official_broker_providers": [],
      "require_official_for_live": false,
      "allow_execution_venue_for_live": true,
      "require_tiger_price_feed_readiness": true,
      "max_live_bar_lag_minutes": 15,
      "max_public_quote_age_minutes": 15,
      "price_sanity": {
        "enabled": true,
        "min_price": 3000,
        "max_price": 6000,
        "max_quote_bar_deviation_pct": 3
      }
    }
  },
  "broker_feed": {
    "input_dir": "data/broker_feeds/gold_5m",
    "pattern": "*.csv",
    "symbol": "GOLD",
    "timeframe": "5m",
    "provider": "mt5_csv"
  },
  "oanda_feed": {
    "environment": "practice",
    "token_env": "OANDA_API_TOKEN",
    "account_id_env": "OANDA_ACCOUNT_ID",
    "instrument": "XAU_USD",
    "granularity": "M5",
    "price": "M",
    "count": 500,
    "symbol": "GOLD",
    "timeframe": "5m",
    "timeout_seconds": 10
  },
  "binance_usdm_feed": {
    "environment": "mainnet",
    "base_url": "https://fapi.binance.com",
    "symbol": "XAUUSDT",
    "interval": "5m",
    "output_symbol": "GOLD",
    "timeframe": "5m",
    "limit": 500,
    "timeout_seconds": 10
  },
  "binance_usdm_1m_feed": {
    "environment": "mainnet",
    "base_url": "https://fapi.binance.com",
    "symbol": "XAUUSDT",
    "interval": "1m",
    "output_symbol": "GOLD",
    "timeframe": "1m",
    "limit": 500,
    "timeout_seconds": 10
  },
  "tiger_futures_feed": {
    "enabled": false,
    "props_path_env": "TIGER_OPENAPI_CONFIG_PATH",
    "provider": "tiger_openapi:COMEX",
    "contract": "MGCmain",
    "output_symbol": "MGCmain",
    "exchange": "COMEX",
    "period": "1m",
    "timeframe": "1m",
    "limit": 500,
    "grab_quote_permission": false,
    "timeout_seconds": 10
  },
  "broker_profiles": {
    "binance_usdm": {
      "provider": "binance_usdm",
      "environment": "demo",
      "base_url": "https://demo-fapi.binance.com",
      "dry_run": true,
      "dry_run_account_equity": 10000,
      "api_key_env": "BINANCE_API_KEY",
      "api_secret_env": "BINANCE_API_SECRET",
      "allowed_symbols": ["GOLD", "XAUUSD"],
      "instrument_map": {
        "GOLD": "XAUUSDT",
        "XAUUSD": "XAUUSDT"
      },
      "request_dir": "live_order_requests",
      "timeout_seconds": 10
    },
    "binance_usdm_testnet": {
      "provider": "binance_usdm",
      "environment": "testnet",
      "base_url": "https://demo-fapi.binance.com",
      "dry_run": false,
      "api_key_env": "BINANCE_API_KEY",
      "api_secret_env": "BINANCE_API_SECRET",
      "allowed_symbols": ["GOLD", "XAUUSD"],
      "instrument_map": {
        "GOLD": "XAUUSDT",
        "XAUUSD": "XAUUSDT"
      },
      "request_dir": "testnet_order_requests",
      "protective_order_endpoint": "algoOrder",
      "reconcile_account_history": true,
      "timeout_seconds": 10
    },
    "tiger_openapi_paper": {
      "provider": "tiger_openapi",
      "environment": "paper",
      "exchange": "COMEX",
      "dry_run": true,
      "props_path_env": "TIGER_OPENAPI_CONFIG_PATH",
      "base_currency": "USD",
      "account_segment_priority": ["C", "F", "S"],
      "confirm_tiger_paper_orders": false,
      "preview_before_place": true,
      "require_flat_before_entry": true,
      "require_no_open_orders_before_entry": true,
      "require_reconciliation_before_entry": true,
      "require_attached_protection_before_entry": true,
      "contract_multiplier": 10,
      "allowed_symbols": ["MGCmain", "MGC2608", "1OZmain", "1OZ2608"],
      "contract_map": {
        "MGCmain": "MGCmain",
        "MGC2608": "MGC2608",
        "1OZmain": "1OZmain",
        "1OZ2608": "1OZ2608"
      },
      "execution_contract_map": {
        "MGCmain": "MGC2608",
        "MGC": "MGC2608",
        "1OZmain": "1OZ2608",
        "1OZ": "1OZ2608"
      },
      "rollover_policy": {
        "rollover_days_before_contract_month": 14,
        "deadline_basis": "first_day_of_contract_month"
      },
      "require_live_money_guardrails_before_entry": true,
      "attended_paper_canary": {
        "enabled": true,
        "scope": "explicit_tiger_paper_canary_only",
        "max_contracts": 1,
        "max_candidate_stop_loss_pct_of_equity": 2.5,
        "live_money_guardrails": {
          "single_order_max_notional": 45000.0,
          "total_account_max_notional": 45000.0,
          "max_daily_entry_orders": 1,
          "max_reconciliation_age_seconds": 600
        }
      },
      "contract_specs": {
        "MGC2608": {
          "symbol": "MGC",
          "currency": "USD",
          "exchange": "COMEX",
          "contract_month": "202608",
          "multiplier": 10,
          "local_symbol": "MGC2608"
        },
        "1OZ2608": {
          "symbol": "1OZ",
          "currency": "USD",
          "exchange": "COMEX",
          "contract_month": "202608",
          "multiplier": 1,
          "local_symbol": "1OZ2608"
        }
      },
      "request_dir": "tiger_order_requests",
      "network_order_submission": "not_implemented_fail_closed",
      "enable_tiger_kill_switch_network_actions": false,
      "timeout_seconds": 10
    }
  },
  "schedule": {
    "profile": "dualtrack_focus"
  },
  "testnet_trading": {
    "enabled": false,
    "broker_profile": "binance_usdm_testnet",
    "request_dir": "testnet_order_requests",
    "max_order_quantity": 0.002,
    "require_flat_before_entry": true,
    "protective_order_endpoint": "algoOrder",
    "note": "Manual-only Binance USDM testnet drill profile for XAUUSDT. It is not used by the default runner and never targets mainnet."
  },
  "demo_trading": {
    "enabled": false,
    "active_strategy_id": "gold_1m_macd",
    "broker_profile": "binance_usdm",
    "request_dir": "demo_order_requests",
    "account_equity": 10000,
    "max_order_quantity": 2.0,
    "require_flat_before_entry": true,
    "protective_failure_action": "reduce_only_close",
    "note": "Only gold_1m_macd (1m MACD golden/death cross) may submit real Binance Futures Demo XAUUSDT orders. Other strategies remain paper."
  }
}
