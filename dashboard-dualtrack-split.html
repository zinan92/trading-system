<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Extended 网格交易机器人</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <script src="data/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="packages/standard-kline/standard-kline.js"></script>
  <style>
    :root{--shell:var(--bg);--card:var(--panel);--field:var(--panel2);--line:var(--rule);--line2:var(--rule-strong);--blue:var(--machine);--violet:var(--human);--green:var(--run);--red:var(--block);--soft:var(--ink);--tint-blue:color-mix(in srgb,var(--machine) 13%,transparent);--tint-green:color-mix(in srgb,var(--run) 13%,transparent);--tint-red:color-mix(in srgb,var(--block) 13%,transparent)}
    *{box-sizing:border-box} body{margin:0;background:var(--shell);color:var(--ink);font:14px/1.48 var(--sans,Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif);-webkit-font-smoothing:antialiased} button,input,select{font:inherit}.mono,table,.metric strong,.kv b{font-variant-numeric:tabular-nums;font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace)}
    .top{height:72px;display:flex;align-items:center;gap:14px;padding:0 25px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;z-index:20;top:0}.brand{font-size:19px;font-weight:700;white-space:nowrap}.brand span{color:var(--ink)}.pill{border:1px solid var(--line2);border-radius:9px;padding:6px 12px;color:var(--muted);font-size:13px;white-space:nowrap}.pill.live{color:var(--block);border-color:var(--block);background:color-mix(in srgb,var(--block) 18%,transparent);font-weight:700;border-radius:99px}.pill.ok{color:var(--run);border-color:var(--run);background:color-mix(in srgb,var(--run) 13%,transparent);border-radius:99px}.top-status{margin-left:auto;color:var(--muted);font-size:14px}.top-status.ok{color:var(--run)}.top-status::before{content:"●";font-size:10px;margin-right:5px}
    .shell{display:grid;grid-template-columns:calc(25% - 6px) minmax(0,1fr);gap:20px;padding:22px 23px;max-width:1920px;margin:0 auto}.left{display:grid;gap:22px;align-content:start}.main{display:grid;gap:22px;align-content:start}.card{min-width:0;background:var(--card);border:1px solid var(--rule);border-radius:10px;box-shadow:0 2px 10px rgba(255,255,255,.08)}.card-title{color:var(--ink);font-size:18px;font-weight:700;padding:22px 21px 10px}.card-body{padding:12px 21px 21px}.label{display:block;color:var(--muted);font-size:14px;font-weight:700;margin:0 0 7px}.select,.input{width:100%;min-height:45px;padding:10px 14px;background:var(--field);border:1px solid var(--line);border-radius:7px;color:var(--ink);outline:none;font-weight:600}.select:focus,.input:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--tint-blue)}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.market-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.button{border:1px solid transparent;border-radius:7px;padding:11px 13px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.button:hover{filter:brightness(1.1)}.button:disabled{cursor:not-allowed;opacity:.55}.button.subtle{background:var(--field);border-color:var(--line2);color:var(--soft)}.button.fill{width:100%;margin-top:16px;background:linear-gradient(90deg,var(--violet),var(--blue));font-size:15px}.trend-box{margin-top:20px;padding:17px;border:1px solid var(--blue);border-radius:9px;background:var(--tint-blue)}.trend-box h3{margin:3px 0 8px;font-size:18px}.trend-box p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.trend-box .recommendation{display:block;width:100%;border:0;background:transparent;text-align:center;color:white;font-weight:700;margin:16px 0 0;padding:8px;cursor:pointer;font-size:15px}.trend-receipt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:12px 0;padding:10px;border:1px dashed var(--line2);border-radius:6px;background:color-mix(in srgb,var(--panel2) 72%,transparent)}.trend-receipt span{color:var(--muted);font-size:11px}.trend-receipt b{display:block;color:var(--ink);font-size:12px;margin-top:2px}.trend-box details{margin-top:11px;color:var(--muted);font-size:12px}.trend-box summary{cursor:pointer;color:var(--soft);font-weight:700}.trend-box details p{font-size:12px;margin-top:8px}
    .receipt-link{width:100%;margin-top:12px;padding:10px 11px;border:1px solid color-mix(in srgb,var(--machine) 55%,var(--line));border-radius:6px;background:color-mix(in srgb,var(--machine) 9%,var(--panel2));color:var(--ink);text-align:left;cursor:pointer}.receipt-link span{display:block;color:var(--machine);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.receipt-link b{display:block;margin-top:3px;font-size:13px}.receipt-link small{display:block;margin-top:3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ai-dialog{width:min(1120px,calc(100vw - 40px));max-height:calc(100vh - 40px);padding:0;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--ink);box-shadow:0 28px 90px color-mix(in srgb,var(--bg) 68%,transparent)}.ai-dialog::backdrop{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(3px)}.receipt-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent)}.receipt-head h2{margin:0;font-size:18px}.receipt-head .receipt-history{margin-left:auto;min-width:230px}.receipt-close{width:36px;height:36px;border:1px solid var(--line2);border-radius:6px;background:var(--field);color:var(--ink);cursor:pointer}.receipt-body{padding:18px;overflow:auto;max-height:calc(100vh - 112px)}.receipt-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.receipt-chip{padding:5px 8px;border:1px solid var(--line);border-radius:99px;background:var(--field);color:var(--muted);font:11px var(--mono,monospace)}.receipt-chip.ok{color:var(--run);border-color:color-mix(in srgb,var(--run) 45%,var(--line))}.receipt-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:16px}.receipt-pane{min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}.receipt-pane-title{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}.receipt-pane-title small{color:var(--muted);font-weight:400}.receipt-stack{display:grid;gap:10px;padding:12px}.receipt-tf{position:relative;padding:11px 12px 11px 16px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}.receipt-tf::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--machine);border-radius:6px 0 0 6px}.receipt-tf-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.receipt-tf-head b{font-size:14px}.receipt-tf-head span{color:var(--muted);font-size:11px}.receipt-window{margin-top:4px;color:var(--muted);font-size:11px}.receipt-indicators{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.receipt-indicators span{padding:6px;border-radius:4px;background:var(--field);color:var(--muted);font-size:10px}.receipt-indicators b{display:block;margin-top:2px;color:var(--ink);font:12px var(--mono,monospace)}.receipt-output{padding:14px}.receipt-output h3{margin:0 0 5px;font-size:20px}.receipt-output p{margin:8px 0;color:var(--muted)}.receipt-levels{font:12px var(--mono,monospace);color:var(--ink)}.score-parts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}.score-parts div{padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:5px}.score-parts span{display:block;color:var(--muted);font-size:10px}.score-parts b{font:12px var(--mono,monospace)}.receipt-archive{margin-top:12px;padding:10px;border:1px dashed var(--line2);border-radius:5px;color:var(--muted);font:11px/1.5 var(--mono,monospace);overflow-wrap:anywhere}.receipt-raw{margin:12px}.receipt-raw summary{cursor:pointer;font-weight:700}.receipt-raw pre{max-height:280px;overflow:auto;margin:8px 0 0;padding:10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:11px/1.5 var(--mono,monospace);white-space:pre-wrap;overflow-wrap:anywhere}
    .choice-label{margin-top:17px;color:var(--muted);font-weight:700;font-size:14px}.choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:9px}.choice-row.two{grid-template-columns:1fr 1fr}.choice{border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);padding:14px 4px 10px;font-size:16px;font-weight:700;cursor:pointer;transition:border-color .14s ease,background .14s ease,transform .14s ease}.choice:hover{transform:translateY(-1px)}.choice small{display:block;color:var(--muted);font-weight:400;margin-top:4px;font-size:12px}.choice.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);color:white;background:color-mix(in srgb,var(--human) 8%,var(--panel2))}.choice.on.style{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet)}.params{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin-top:18px}.params .wide{grid-column:1/-1}.hint{color:var(--muted);font-size:13px;margin:12px 1px 0;line-height:1.45}.preview-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;padding:11px;border:1px dashed var(--rule-strong);border-radius:7px;background:var(--panel2)}.preview-summary div{min-width:0}.preview-summary span{display:block;color:var(--muted);font-size:11px}.preview-summary b{display:block;margin-top:3px;color:var(--ink);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.robot-actions{display:grid;gap:12px;margin-top:20px}.robot{border:1px solid transparent;border-radius:8px;padding:15px;color:white;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .14s ease,background .14s ease,box-shadow .14s ease}.robot.start{background:color-mix(in srgb,var(--run) 52%,var(--panel2))}.robot.stop{background:var(--red)}.robot.start.is-active{background:var(--run);box-shadow:0 0 0 1px color-mix(in srgb,var(--run) 28%,transparent),0 8px 24px color-mix(in srgb,var(--run) 18%,transparent)}.robot.start.is-inactive{background:color-mix(in srgb,var(--run) 18%,var(--panel2));color:var(--muted);box-shadow:none}.robot.stop.is-active{background:var(--block);box-shadow:0 0 0 1px color-mix(in srgb,var(--block) 30%,transparent),0 8px 24px color-mix(in srgb,var(--block) 18%,transparent)}.robot.stop.is-inactive{background:color-mix(in srgb,var(--block) 18%,var(--panel2));color:var(--muted);box-shadow:none}.robot:disabled{cursor:not-allowed;opacity:.62}.robot small{font-weight:400;opacity:.77}.adjust-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.utility{width:100%;margin-top:17px;text-align:center;border-color:transparent!important;background:transparent!important;color:var(--ink)!important;font-weight:700}.utility strong{display:block;font-size:16px}.utility small{color:var(--muted);font-weight:400;margin-top:9px}.utility:hover{color:var(--machine)!important}
    .account{padding:14px 22px 22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.account .metric{min-width:0;padding:19px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}.metric span{display:block;color:var(--muted);font-size:14px;font-weight:700}.metric strong{display:block;font-size:29px;line-height:1.15;margin-top:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric small{display:block;color:var(--muted);margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pos{color:var(--green)!important}.neg{color:var(--red)!important}.chart-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:23px 21px 7px}.chart-title h2{margin:0;color:var(--ink);font-size:19px}.chart-tools{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.timeframes{display:flex;gap:5px;flex-wrap:wrap}.timeframes button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:5px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}.timeframes button.on{background:color-mix(in srgb,var(--machine) 24%,var(--panel2));border-color:var(--machine);color:var(--ink)}.indicators{display:flex;align-items:center;gap:7px;padding-right:10px;border-right:1px solid var(--line)}.indicator-toggle{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}.indicator-toggle input{accent-color:var(--blue)}.ema-period{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:11px}.ema-period input{width:42px;min-height:28px;padding:3px 5px;text-align:center;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:4px}.grid-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 21px 0;color:var(--muted);font-size:12px}.grid-summary b{color:var(--ink)}.grid-summary .grid-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--violet)}.grid-summary .grid-dot.sell{background:var(--red)}.grid-summary .grid-dot.buy{background:var(--green)}.chart-gate{margin:9px 21px 0;border-left:3px solid var(--red);background:var(--tint-red);color:var(--ink);padding:9px 11px;border-radius:4px;font-weight:700}.chart-wrap{padding:10px 17px 17px}.chart{height:580px;position:relative}.chart-key{color:var(--muted);font-size:13px;margin-left:21px}.status-row{display:grid;grid-template-columns:1fr 1fr;gap:22px}.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--rule)}.kv:last-child{border:0}.kv span{color:var(--muted)}.kv b{font-size:14px;text-align:right}.table-wrap{max-height:580px;overflow:auto;padding:0 18px 16px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 7px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}th{color:var(--muted);font-size:13px}td{color:var(--ink)}.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--line);padding:0 13px}.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:13px 12px;white-space:nowrap;cursor:pointer}.tabs button.on{color:var(--ink);border-bottom-color:var(--blue);font-weight:700}.tab{display:none}.tab.on{display:block}.shadow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px}.shadow-grid article{padding:13px;border:1px solid var(--line);background:var(--field);border-radius:7px}.shadow-grid article>b{color:var(--human)}.banner{font-size:12px;color:var(--ink)}.hidden{display:none!important}
    @media(max-width:1100px){.top{height:auto;min-height:72px;padding:11px 22px;align-items:center;flex-wrap:wrap}.top-status{margin-left:0}.shell{grid-template-columns:1fr}.left{grid-template-columns:1fr}.account{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.top{position:static;min-height:58px;padding:11px 13px;align-items:flex-start;gap:8px}.top-status{width:100%}.shell{padding:10px;gap:10px}.left{grid-template-columns:1fr;gap:10px}.card-title{padding:13px 14px 5px}.card-body{padding:8px 14px 14px}.account{padding:10px;gap:9px}.metric strong{font-size:19px}.chart-title{align-items:flex-start;flex-direction:column}.chart-tools{justify-content:flex-start}.indicators{padding:0 0 8px;border-right:0;border-bottom:1px solid var(--line)}.chart{height:330px}.status-row{grid-template-columns:1fr}.split,.adjust-grid{grid-template-columns:1fr}.params{grid-template-columns:1fr}.params .wide{grid-column:auto}.shadow-grid{grid-template-columns:1fr}.ai-dialog{width:calc(100vw - 16px);max-height:calc(100vh - 16px)}.receipt-head{align-items:flex-start;flex-wrap:wrap;padding:12px}.receipt-head .receipt-history{order:3;width:100%;margin-left:0}.receipt-body{padding:10px;max-height:calc(100vh - 132px)}.receipt-layout{grid-template-columns:1fr}.receipt-indicators{grid-template-columns:1fr 1fr}.score-parts{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">Extended <span>网格交易机器人</span></div>
    <span class="pill live">PAPER</span>
    <span class="pill ok" id="marketBadge">行情：读取中</span>
    <span class="pill ok" id="sourceBadge">来源：读取中</span>
    <span class="pill" id="cycleBadge">策略周期：--</span>
    <span class="pill" id="accessBadge">本地控制</span>
    <button class="pill" id="healthButton" type="button">自检</button>
    <span class="top-status" id="runBadge">状态读取中</span>
  </header>
  <main class="shell">
    <aside class="left">
      <section class="card">
        <div class="card-title">市场与趋势</div>
        <div class="card-body">
          <div class="split"><label><span class="label">Broker 来源</span><input class="input" id="brokerSource" readonly value="读取中"></label><label><span class="label">交易对</span><select class="select" id="symbol"><option value="GOLD">GOLD</option></select></label></div>
          <div class="market-actions"><label><span class="label">K 线周期</span><select class="select" id="timeframe"><option value="1m">1m</option><option value="5m">5m</option><option value="15m">15m</option><option value="30m">30m</option><option value="1h">1h</option><option value="4h">4h</option></select></label><div><span class="label">趋势</span><button class="button subtle" id="refreshTrend" type="button">刷新趋势</button></div></div>
          <div class="trend-box" id="trendBox"><span class="label">当前趋势识别</span><h3>读取可信行情中</h3><p>只使用真实 broker 行情；行情陈旧、缺失或 synthetic 时停止新开仓。</p><button class="recommendation" id="adoptRecommendation" type="button">采用推荐策略 + 自动区间</button></div>
        </div>
      </section>
      <section class="card">
        <div class="card-title">策略配置</div>
        <div class="card-body">
          <div class="choice-label">策略方向</div><div class="choice-row" id="directionChoices"><button class="choice" data-direction="neutral" type="button">中性<small>双向震荡</small></button><button class="choice" data-direction="long" type="button">做多<small>低买高卖</small></button><button class="choice" data-direction="short" type="button">做空<small>高空低回补</small></button></div>
          <div class="choice-label">风格</div><div class="choice-row two" id="styleChoices"><button class="choice style on" data-style="steady" type="button">稳健<small>更宽区间</small></button><button class="choice style" data-style="aggressive" type="button">激进<small>更密网格</small></button></div>
          <button class="button fill" id="smartFill" type="button">◎ 根据当前行情智能填充参数</button>
	          <div class="params"><label><span class="label">下边界</span><input class="input" id="rangeLow" inputmode="decimal"></label><label><span class="label">上边界</span><input class="input" id="rangeHigh" inputmode="decimal"></label><label><span class="label">网格数量</span><input class="input" id="gridCount" inputmode="numeric"></label><label><span class="label">每格数量（名义）</span><input class="input" id="gridNotional" inputmode="decimal"></label><label><span class="label">杠杆上限（x）</span><input class="input" id="leverage" inputmode="decimal"></label><label><span class="label">价格冲出区间时</span><select class="select" id="outOfRange"><option value="wait">回收阶梯（只减仓等待）</option><option value="stop">停止新开仓</option><option value="replan">重新规划区间</option></select></label></div>
          <p class="hint" id="paramHint">参数来自当前生产计划；改变后须明确应用，绝不静默混合。</p>
          <div class="preview-summary hidden" id="previewSummary"></div>
          <div class="robot-actions"><button class="robot start" id="startRobot" type="button">启动机器人</button><button class="robot stop" id="stopRobot" type="button">停止 + 撤单 + 平仓</button></div>
        </div>
      </section>
      <section class="card">
        <div class="card-title">运行中调整</div>
        <div class="card-body"><div class="adjust-grid"><label><span class="label">新下边界</span><input class="input" id="adjustLow" inputmode="decimal"></label><label><span class="label">新上边界</span><input class="input" id="adjustHigh" inputmode="decimal"></label></div><button class="button subtle utility" id="applyAdjustment" type="button"><strong>调整区间（不停止网格）</strong><small>间距保持不变，只在边缘增/撤挂单；历史订单、成交与账本保留。</small></button><button class="button subtle utility" id="resetStats" type="button"><strong>重置盈亏 / 交易量统计</strong><small>仅清零显示统计，持仓与挂单不受影响。</small></button><p class="hint" id="actionStatus">读取真实控制状态中。</p></div>
      </section>
    </aside>
    <section class="main">
      <section class="card"><div class="card-title">账户总览</div><div class="account" id="account"></div></section>
      <section class="card"><div class="chart-title"><h2>价格 / 网格</h2><div class="chart-tools"><div class="indicators"><label class="indicator-toggle"><input id="showEma" type="checkbox" checked>EMA</label><label class="ema-period">快<input id="emaFast" type="number" min="2" max="200" value="20"></label><label class="ema-period">慢<input id="emaSlow" type="number" min="3" max="300" value="50"></label><label class="indicator-toggle"><input id="showMacd" type="checkbox">MACD</label></div><div class="timeframes" id="timeframeButtons"></div></div></div><div class="chart-key" id="chartMeta">可信 datafeed 读取中</div><div class="grid-summary" id="gridSummary">网格读取中</div><div class="chart-gate hidden" id="gate"></div><div class="chart-wrap"><div class="chart" id="productionChart" data-standard-kline-host></div></div></section>
      <section class="status-row"><section class="card"><div class="card-title">实时状态</div><div class="card-body" id="live">读取中</div></section><section class="card"><div class="card-title">成交记录</div><div class="table-wrap"><table id="baselineFills"></table></div></section></section>
      <section class="card"><div class="tabs" id="tabs"><button class="on" data-tab="positions" type="button">当前持仓</button><button data-tab="orders" type="button">当前委托</button><button data-tab="fills" type="button">成交记录</button><button data-tab="review" type="button">12小时复盘</button><button data-tab="shadows" type="button">Strategy Shadows</button><button data-tab="history" type="button">历史收益 / NAV</button></div><div class="tab on" data-panel="positions"><div class="table-wrap"><table id="positions"></table></div></div><div class="tab" data-panel="orders"><div class="table-wrap"><table id="orders"></table></div></div><div class="tab" data-panel="fills"><div class="table-wrap"><table id="fills"></table></div></div><div class="tab card-body" data-panel="review" id="review"></div><div class="tab" data-panel="shadows"><div class="shadow-grid" id="shadows"></div></div><div class="tab card-body" data-panel="history" id="history"></div></section>

    <div class="receipt-body" id="aiReceiptContent"></div>
  </dialog>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PUBLIC_OBSERVER=!['127.0.0.1','localhost','::1'].includes(location.hostname);
const ACCESS_CONTROLLED=()=>!PUBLIC_OBSERVER||state.auth?.can_control===true;
const esc=v=>String(v??"--").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const num=v=>Number.isFinite(Number(v))?Number(v).toLocaleString("en-US",{maximumFractionDigits:2}):"--";
const signed=v=>{const x=Number(v);return Number.isFinite(x)?`${x>0?"+":""}${num(x)}`:"--"};
const pnlClass=v=>Number(v)>0?"pos":Number(v)<0?"neg":"";
const DIR={range:"震荡 · 中性",range_long_bias:"震荡 · 偏多",range_short_bias:"震荡 · 偏空",long:"做多",short:"做空",neutral:"中性",flat:"观望"};
const RUNTIME={stopped:"已停止",starting:"启动中",running:"运行中",replanning:"调整网格中",stopping:"停止中",error:"运行异常"};
let state={data:null,market:null,chart:null,timeframe:"1m",direction:"neutral",style:"steady",notionalMode:"auto",formDirty:false,preview:null,previewRequest:0,previewTimer:null,notice:"",busy:false,auth:{authenticated:!PUBLIC_OBSERVER,can_control:!PUBLIC_OBSERVER,email:null,session_duration:"168h"},indicators:{ema:true,fast:20,slow:50,macd:false}};

const ACCESS_REAUTH_KEY="goldbot-access-reauth";
function apiFailure(message,status=0,code=""){const error=Error(message);error.status=status;error.code=code;return error}
async function api(url,opts={}){
  const headers=new Headers(opts.headers||{});
  headers.set("Accept","application/json");
  headers.set("X-Requested-With","XMLHttpRequest");
  const response=await fetch(url,{...opts,headers,credentials:"same-origin"});
  const contentType=(response.headers.get("content-type")||"").toLowerCase();
  const text=await response.text();
  const accessLoginHtml=PUBLIC_OBSERVER&&contentType.includes("text/html")&&(/Cloudflare Access/i.test(text)||/<title>\s*Sign in/i.test(text));
  if(response.status===401||accessLoginHtml){
    if(PUBLIC_OBSERVER&&sessionStorage.getItem(ACCESS_REAUTH_KEY)!=="1"){
      sessionStorage.setItem(ACCESS_REAUTH_KEY,"1");
      setTimeout(()=>location.reload(),80);
    }
    throw apiFailure("登录会话已过期，正在重新登录……",401,"access_session_expired");
  }
  let body={};
  if(text){
    if(!contentType.includes("application/json"))throw apiFailure(`服务暂时返回了网页而不是数据（HTTP ${response.status}），请刷新后重试。`,response.status,"unexpected_content_type");
    try{body=JSON.parse(text)}catch(_error){throw apiFailure("服务返回的数据格式异常，请刷新后重试。",response.status,"invalid_json");}
  }
  if(response.ok&&PUBLIC_OBSERVER)sessionStorage.removeItem(ACCESS_REAUTH_KEY);
  if(!response.ok)throw apiFailure(body.message||body.error||`请求失败（HTTP ${response.status}）`,response.status,body.error||"http_error");
  return body;
}
function isFresh(m){return ["ready","derived"].includes(m?.status)&&m?.fresh===true&&m?.is_synthetic!==true}
function statusText(m){return isFresh(m)?"实时·可信":"异常·停止新开仓"}
function planDirection(p){return DIR[p?.direction]||p?.direction||"中性"}
function setNotice(message){state.notice=message;const target=$("#actionStatus");if(target)target.textContent=message}
function setChoice(selector,key,value){$$(`${selector} [data-${key}]`).forEach(button=>button.classList.toggle("on",button.dataset[key]===value))}
function humanSource(m){return m?.provider==="binance_usdm"?"Binance USD-M 演示行情":(m?.provider||"未知来源")}
function humanTime(timestamp){const date=new Date(timestamp||"");return Number.isNaN(date.getTime())?"--":new Intl.DateTimeFormat("zh-CN",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Shanghai"}).format(date)}
function humanDateTime(timestamp){const date=new Date(timestamp||"");return Number.isNaN(date.getTime())?"--":new Intl.DateTimeFormat("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Shanghai"}).format(date)}
function beijingDateTime(timestamp){const date=new Date(timestamp||"");if(Number.isNaN(date.getTime()))return"--";const parts=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23",timeZone:"Asia/Shanghai"}).formatToParts(date).filter(part=>part.type!=="literal").map(part=>[part.type,part.value]));return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}`}
function quantityText(value){const number=Number(value);return Number.isFinite(number)?number.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:6,useGrouping:false}):"--"}
function runtimeActionText(runtime){const action=runtime?.last_action;if(action==="stop")return'收到停止指令：“停止 + 撤单 + 平仓”';if(action==="start")return"收到启动指令";if(action==="adjust_plan")return"应用运行中网格调整";if(action==="reset_statistics")return"重置统计显示基线";return"没有可追溯的控制动作"}
function runtimeActorText(runtime){const event=runtime?.last_control_event;if(!event||!event.actor)return"无记录（审计上线前的历史动作）";const who=event.actor.email||"本机操作者";const via=event.actor.transport==="public_gateway"?"公网（已验证登录）":"本机";return`${who} · ${via}`}
function latestRecommendation(data){return (data?.proposals||[]).filter(row=>row.source==="ai"&&row.signal?.calibration_status==="uncalibrated").sort((a,b)=>String(b.created_at||"").localeCompare(String(a.created_at||"")))[0]||null}
function aiEvaluations(data){return (data?.proposals||[]).filter(row=>row.source==="ai"&&row.evaluation_receipt?.evaluation_id).sort((a,b)=>String(b.created_at||"").localeCompare(String(a.created_at||"")))}
function styleLabel(value){return value==="aggressive"?"激进":"稳健"}
function productionStrategyLabel(plan){if(!plan)return"--";const style=plan.style?(plan.style==="aggressive"?"激进":"稳健"):"历史兼容",method=plan.range?.method||"固定区间",count=plan.grid?.count||plan.grid?.orders?.length;return `${planDirection(plan)} · ${style} · ${method}${count?` · ${count} 格`:""}`}

function renderTrend(data,fresh){
  const recommendation=latestRecommendation(data),box=$("#trendBox"),controlled=ACCESS_CONTROLLED();
  if(!fresh){box.innerHTML='<span class="label">当前趋势识别</span><h3>行情不可用</h3><p>行情未满足可信门控，系统已停止新开仓。不会使用 fallback 或 synthetic 数据。</p>';return}
  if(!recommendation){box.innerHTML=`<span class="label">当前趋势识别</span><h3>尚未重新评估</h3><p>点击上方“刷新趋势”后，AI 才会读取固定 D1 / 4H / 1H / 15m 数据与 EMA / MACD 指标，提出方向和风格建议；当前生产计划不会自动改变。</p>`;return}
  const signal=recommendation.signal||{},contexts=recommendation.analysis?.contexts||{},d1=contexts["1d"]||{},h4=contexts["4h"]||{},m15=contexts["15m"]||{},score=Number(signal.rule_score),scoreText=Number.isFinite(score)?`${num(score)}/100 · 未校准`:"未校准",self=Number(signal.ai_self_assessment),created=recommendation.created_at?humanTime(recommendation.created_at):"--",receipt=recommendation.evaluation_receipt||{},archive=receipt.archive?.relative_path||"尚未留档";
  box.innerHTML=`<span class="label">当前趋势识别 · AI 评估于 ${created}</span><h3>${planDirection(recommendation)} · ${styleLabel(recommendation.style)}</h3><div class="trend-receipt"><div><span>规则评分</span><b>${scoreText}</b></div><div><span>AI 自评</span><b>${Number.isFinite(self)?`${num(self)}/10`:"--"} · 非概率</b></div><div><span>Range 输入</span><b>D1 ATR14 ${num(d1.atr14)}</b></div><div><span>短周期确认</span><b>15m EMA20 ${num(m15.indicators?.ema20)}</b></div></div><p>${esc(recommendation.rationale||"本次评估没有返回可解释理由。")}</p><button class="receipt-link" id="openAiReceipt" type="button"><span>AI 评估收据 · Input / Output</span><b>查看本次 AI Input / Output</b><small>本地留档：${esc(archive)}</small></button><button class="recommendation" id="adoptRecommendation" type="button" ${controlled?"":"disabled"}>将该建议载入参数预览（不会下单）</button>`;
}

function receiptIndicator(value){return value==null?"样本不足":num(value)}
function renderAiReceipt(recommendation){
  const receipt=recommendation?.evaluation_receipt||{},input=receipt.input||{},output=receipt.output||{},contexts=input.contexts||recommendation?.analysis?.contexts||{},order=["4h","15m","1d","1h"],labels={"1d":"D1 K 线","4h":"4H K 线","1h":"1H K 线","15m":"15m K 线"};
  const contextCards=order.map(tf=>{const c=contexts[tf]||{},ind=c.indicators||{},macd=ind.macd||{};return `<article class="receipt-tf"><div class="receipt-tf-head"><b>${labels[tf]}</b><span>${num(c.bar_count)} 根完整 K 线 · ${esc(c.provider||"--")}</span></div><div class="receipt-window">${humanDateTime(c.start)} → ${humanDateTime(c.end)} · 最新收盘 ${num(c.close)}</div><div class="receipt-indicators"><span>${tf==="15m"?"15m EMA20":"EMA20"}<b>${receiptIndicator(ind.ema20)}</b></span><span>EMA50<b>${receiptIndicator(ind.ema50)}</b></span><span>MACD (12/26/9)<b>${receiptIndicator(macd.line)} / ${receiptIndicator(macd.signal)}</b></span><span>MACD 柱<b>${receiptIndicator(macd.histogram)}</b></span><span>ATR14<b>${num(c.atr14)}</b></span><span>趋势 / 效率<b>${esc(c.trend||"--")} · ${num(c.directional_efficiency)}</b></span></div></article>`}).join("");
  const parsed=output.parsed_decision||{},validation=output.deterministic_validation||{},parts=validation.rule_score_components||{},effects=receipt.effects||{},archive=receipt.archive||{};
  const partLabels={timeframe_alignment:"周期一致性",signal_strength:"信号强度",regime_fit:"状态适配",data_health:"数据健康",historical_calibration:"历史校准"};
  const scores=Object.entries(parts).map(([key,value])=>`<div><span>${partLabels[key]||esc(key)}</span><b>${num(value)}</b></div>`).join("");
  const raw=output.raw_model_response||JSON.stringify(parsed,null,2),prompt=input.prompt||recommendation?.prompt_contract?.prompt||"--";
  $("#aiReceiptContent").innerHTML=`<div class="receipt-meta"><span class="receipt-chip ok">${receipt.status==="success"?"SUCCESS":"FAILED"}</span><span class="receipt-chip">${esc(receipt.evaluation_id||"--")}</span><span class="receipt-chip">${humanDateTime(receipt.evaluated_at)}</span><span class="receipt-chip">完整 K 线 · 禁止 synthetic · 图表周期未使用</span></div><div class="receipt-layout"><section class="receipt-pane"><div class="receipt-pane-title"><span>INPUT · AI 实际看到了什么</span><small>D1 / 4H / 1H / 15m</small></div><div class="receipt-stack">${contextCards}</div><details class="receipt-raw"><summary>查看完整 Prompt</summary><pre>${esc(prompt)}</pre></details></section><section class="receipt-pane"><div class="receipt-pane-title"><span>OUTPUT · AI 做了什么决定</span><small>原始输出 + 规则校验</small></div><div class="receipt-output"><h3>${planDirection(parsed)} · ${styleLabel(parsed.style)}</h3><p>${esc(parsed.rationale||recommendation?.rationale||"--")}</p><div class="receipt-levels">关键位：${esc((parsed.key_levels||recommendation?.key_levels||[]).join(" / ")||"--")}</div><div class="score-parts">${scores}</div><div class="receipt-archive">本地留档<br>${esc(archive.relative_path||"--")}<br>SHA256 ${esc(archive.sha256||"--")}<br>生产计划未改变：${effects.production_plan_unchanged===true?"是":"待确认"} · 下单：${num(effects.orders_created||0)} 笔</div></div><details class="receipt-raw"><summary>查看 AI 原始 Output JSON</summary><pre>${esc(raw)}</pre></details></section></div>`;
}

function openAiReceipt(evaluationId){const rows=aiEvaluations(state.data),selected=rows.find(row=>row.evaluation_receipt?.evaluation_id===evaluationId)||rows[0];if(!selected)return;const select=$("#aiReceiptHistory");select.innerHTML=rows.map(row=>`<option value="${esc(row.evaluation_receipt.evaluation_id)}" ${row===selected?"selected":""}>${humanDateTime(row.created_at)} · ${planDirection(row)} · ${styleLabel(row.style)}</option>`).join("");renderAiReceipt(selected);$("#aiReceiptDialog").showModal()}

function fillInputs(plan,{force=false}={}){
  if(state.formDirty&&!force)return;
  const range=plan?.range||{},grid=plan?.grid||{},risk=plan?.risk_budget||{};
  $("#rangeLow").value=range.low??"";$("#rangeHigh").value=range.high??"";$("#gridCount").value=grid.count||grid.orders?.length||"";$("#gridNotional").value=grid.notional_per_grid??"";$("#leverage").value=grid.leverage??risk.leverage??risk.max_leverage??"10";$("#outOfRange").value=grid.out_of_range||"wait";$("#adjustLow").value=range.low??"";$("#adjustHigh").value=range.high??"";
  state.notionalMode=grid.notional_mode||"manual";
  state.direction=plan?.direction||"neutral";state.style=plan?.style||"steady";setChoice("#directionChoices","direction",state.direction);setChoice("#styleChoices","style",state.style);
}

function strategyPayload({useInputs=true}={}){
  const payload={direction:state.direction,style:state.style,out_of_range:$("#outOfRange").value};
  if(!useInputs)return payload;
  const low=Number($("#rangeLow").value),high=Number($("#rangeHigh").value),count=Number($("#gridCount").value),notional=Number($("#gridNotional").value),leverage=Number($("#leverage").value);
  if(!Number.isFinite(low)||!Number.isFinite(high)||high<=low)throw Error("下边界必须小于上边界。");
  if(!Number.isInteger(count)||count<2||count>80)throw Error("网格数量必须是 2–80 的整数。");
  if(!Number.isFinite(leverage)||leverage<=0||leverage>10)throw Error("杠杆必须大于 0 且不超过 10x。");
  payload.range={low,high};payload.grid={count,notional_per_grid:Number.isFinite(notional)&&notional>0?notional:0,notional_mode:state.notionalMode,out_of_range:payload.out_of_range};payload.risk_budget={leverage};
  return payload;
}

function applyPreview(preview){
  state.preview=preview;state.formDirty=true;state.direction=preview.direction;state.style=preview.style;state.notionalMode=preview.grid.notional_mode||"manual";
  setChoice("#directionChoices","direction",state.direction);setChoice("#styleChoices","style",state.style);
  $("#rangeLow").value=preview.range.low;$("#rangeHigh").value=preview.range.high;$("#gridCount").value=preview.grid.count;$("#gridNotional").value=preview.grid.notional_per_grid;$("#leverage").value=preview.grid.leverage;$("#adjustLow").value=preview.range.low;$("#adjustHigh").value=preview.range.high;
  const buys=preview.orders.filter(order=>order.side==="buy").length,sells=preview.orders.filter(order=>order.side==="sell").length;
  $("#paramHint").textContent=`待启动预览：D1 ATR14 定 Range · 4H ATR14 定间距 · ${preview.grid.count} 格 · 每格 ${num(preview.grid.notional_per_grid)} USD（${state.notionalMode==="auto"?"自动风险上限":"手工固定"}）· ${buys} 张买单 / ${sells} 张卖单 · 资金预算 ${num(preview.risk.capital_budget)} USD。尚未写入 paper ledger。`;
}

async function control(action,payload={},options={}){
  if(!ACCESS_CONTROLLED()&&action!=='preview')throw Error('需要先使用获授权的 Cloudflare 账号登录。');
  const cycleId=state.data?.cycle?.cycle_id;if(!cycleId)throw Error("当前策略周期尚未读取完成。");
  const result=await api('/api/strategy-console/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cycle_id:cycleId,action,...payload})});
  if(options.reload!==false)await load();
  return result;
}

function isUncertainControlError(error){const status=Number(error?.status);return !Number.isFinite(status)||status===0||status>=500}
const wait=milliseconds=>new Promise(resolve=>setTimeout(resolve,milliseconds));
async function reconcileControlOutcome(action,error){
  if(!isUncertainControlError(error))throw error;
  setNotice("后台响应中断，正在核对真实运行状态；请勿重复点击。");
  let latest=null;
  for(let attempt=0;attempt<12;attempt++){
    if(attempt>0)await wait(2500);
    try{latest=await api('/api/strategy-console/current')}catch(_readError){continue}
    state.data=latest;
    const runtime=latest?.runtime||{},actual=runtime.actual_state||runtime.desired_state||"stopped",execution=latest?.production_execution||{},accepted=(execution.orders||[]).filter(order=>order.state==="accepted").length,open=(execution.trades||[]).filter(trade=>trade.status==="open").length;
    if(action==='start'&&actual==='running'&&accepted>0){state.preview=null;state.formDirty=false;render();return {reconciled:true,plan:latest.production_plan,accepted_orders:accepted}}
    if(action==='stop'&&actual==='stopped'&&accepted===0&&open===0){state.preview=null;state.formDirty=false;render();return {reconciled:true,cancelled_orders:0,flattened_positions:0}}
    if(actual==='error')throw apiFailure(runtime.last_error||"后台执行失败，机器人已进入异常状态。",500,"runtime_error");
  }
  const runtime=latest?.runtime||{},actual=runtime.actual_state||runtime.desired_state||"unknown";
  if(action==='start'&&actual==='stopped')throw apiFailure("后台已确认机器人仍为停止状态，未创建挂单；请检查行情后再试。",502,"start_not_applied");
  throw apiFailure(`操作结果仍未确认（当前状态：${RUNTIME[actual]||actual}），请勿重复点击。`,502,"control_outcome_unknown");
}

async function requestPreview({useInputs=false}={}){
  const requestId=++state.previewRequest;state.formDirty=true;$("#paramHint").textContent="正在根据可信行情计算网格位置与风险……";
  try{
    const result=await control('preview',strategyPayload({useInputs}),{reload:false});
    if(requestId!==state.previewRequest)return null;
    if(result.preview?.schema_version!=="strategy-grid-preview-v1")throw Error("后台未返回标准网格预览。");
    applyPreview(result.preview);render();return result.preview;
  }catch(error){if(requestId===state.previewRequest){state.preview=null;$("#paramHint").textContent=`参数预览不可用：${error.message}`;render()}throw error}
}

function schedulePreview(){clearTimeout(state.previewTimer);state.formDirty=true;state.previewTimer=setTimeout(()=>requestPreview({useInputs:true}).catch(()=>{}),320)}

function executionEngineText(execution){const engine=String(execution?.engine||"");return engine==="nautilus_paper"?"Nautilus Paper（当前）":engine==="legacy_paper"?"Legacy Paper（当前）":engine||"未读取"}
function cutoverGateText(data){const gate=data?.execution_shadow||data?.production_execution?.shadow_cutover||{},observed=Number(gate.observed_consecutive_passes||0),required=Number(gate.required_consecutive_passes||7);if(gate.status==="ready_for_attended_paper_switch")return`Nautilus Shadow：${observed}/${required} · 已通过，待人工切换`;const reasons={latest_reconciliation_drift:"最近完成周期对账有差异",current_observation_drift:"当前周期实时对账有差异",fixed_parity_fixtures_not_passed:"固定生命周期测试未通过",candidate_activity_insufficient:"尚无有效成交周期",cycle_incomplete:"等待当前 12 小时周期结束",cycle_close_evidence_missing:"缺少周期收盘证据",market_event_history_missing:"缺少完整行情事件",market_event_contract_untrusted:"行情事件不可信",market_provider_contract_mismatch:"行情来源不一致",paper_fee_contract_mismatch:"手续费契约不一致",replay_version_missing:"回放版本未锁定",reconciliation_history_missing:"尚无周期证据"};return`Nautilus Shadow：${observed}/${required} · ${reasons[gate.blocker]||"继续收集真实周期"}`}

function render(){
  const data=state.data,plan=data?.production_plan,market=state.market||data?.market||{},execution=data?.production_execution||{},account=execution?.account||{},summary=execution?.trade_summary||{},pnl=execution?.pnl||{},runtime=data?.runtime||{},fresh=isFresh(market),accepted=(execution.orders||[]).filter(order=>order.state==="accepted"),open=(execution.trades||[]).filter(trade=>trade.status==="open"),actual=runtime.actual_state||runtime.desired_state||"stopped",running=actual==="running"&&accepted.length>0;

  fillInputs(plan);
  const total=(Number(pnl.realized)||0)+(Number(pnl.unrealized)||0),returnPct=Number(account.starting_cash)>0?total/Number(account.starting_cash)*100:null;const cards=[["账户余额 / 权益",num(account.equity??account.ending_cash??account.starting_cash),`初始 ${num(account.starting_cash)} USDC`,""],["累计交易量",num(summary.total_notional??summary.notional),`生产成交 ${num(summary.trade_count??execution.trades?.length)} 笔`,""],["总盈亏",signed(total),`收益率 ${returnPct!=null?num(returnPct)+"%":"--"}`,pnlClass(total)],["已实现 / 未实现",`${signed(pnl.realized)} / ${signed(pnl.unrealized)}`,`最大可亏 ${num((state.preview?.risk||plan?.risk_budget)?.max_loss)} USD`,pnlClass(total)]];$("#account").innerHTML=cards.map(([title,value,sub,klass])=>`<div class="metric"><span>${title}</span><strong class="${klass}">${value}</strong><small>${sub}</small></div>`).join("");

function renderRobotControls(data,fresh,execution){
  const runtime=data?.runtime||{},actual=runtime.actual_state||runtime.desired_state||"stopped",accepted=(execution.orders||[]).filter(order=>order.state==="accepted").length,open=(execution.trades||[]).filter(trade=>trade.status==="open").length,runningLike=["starting","running","replanning","stopping"].includes(actual),controlled=ACCESS_CONTROLLED(),canStart=controlled&&!state.busy&&fresh&&["stopped","error"].includes(actual)&&accepted===0&&open===0,canStop=controlled&&!state.busy&&(runningLike||accepted>0||open>0),start=$("#startRobot"),stop=$("#stopRobot");
  start.className=runningLike?'robot start is-inactive':'robot start is-active';stop.className=canStop?'robot stop is-active':'robot stop is-inactive';start.disabled=!canStart;stop.disabled=!canStop;
  start.textContent=!controlled?"登录后可启动机器人":actual==="starting"?"正在启动机器人…":actual==="running"?`机器人运行中 · ${accepted} 笔挂单`:actual==="replanning"?"正在调整网格…":"启动机器人";stop.textContent=!controlled?"登录后可停止机器人":actual==="stopping"?"正在撤单并平仓…":"停止 + 撤单 + 平仓";
  $("#applyAdjustment").disabled=!controlled||state.busy||actual!=="running";$("#resetStats").disabled=!controlled||state.busy;

function renderGridSummary(plan,execution){
  const visual=state.preview||plan,range=visual?.range||{},grid=visual?.grid||{},low=Number(range.low),high=Number(range.high),count=Number(grid.count||grid.orders?.length),orders=state.preview?.orders||(execution.orders||[]).filter(order=>order.state==="accepted"),buys=orders.filter(order=>order.side==="buy").length,sells=orders.filter(order=>order.side==="sell").length,label=state.preview?"待启动预览":"生产网格";

function renderChart(market,plan,execution){
  if(!window.StandardKline)return;if(!state.chart)state.chart=new StandardKline.StandardKlineChart($("#productionChart"),{height:580,minHeight:330,showVolume:true,timeZone:"Asia/Shanghai",locale:"zh-CN"});
  const lines=[],visual=state.preview||plan,low=Number(visual?.range?.low),high=Number(visual?.range?.high),count=Number(visual?.grid?.count||visual?.grid?.orders?.length),latest=Number(market?.latest_close),previewing=Boolean(state.preview),visibleOrders=previewing?state.preview.orders:(execution.orders||[]).filter(order=>order.state==="accepted");
  if(Number.isFinite(low))lines.push({price:low,color:previewing?"#8c74ff":"#35bd71",lineWidth:2,title:previewing?"预览下界":"Range low"});if(Number.isFinite(high))lines.push({price:high,color:previewing?"#8c74ff":"#ef5f5f",lineWidth:2,title:previewing?"预览上界":"Range high"});
  if(Number.isFinite(low)&&Number.isFinite(high)&&high>low&&Number.isInteger(count)&&count>0){const step=(high-low)/count;for(let index=1;index<count;index++){const price=low+step*index;lines.push({price,color:previewing?"#5d5876":price>=latest?"#873f45":"#276446",lineStyle:"dotted",title:previewing?`预览格 ${index}`:`Grid ${index}`,axisLabelVisible:visibleOrders.length===0})}}
  for(const order of visibleOrders){const buy=order.side==="buy";lines.push({price:Number(order.price),color:previewing?"#9b8aff":buy?"#28c76f":"#ff625f",lineWidth:2,lineStyle:previewing?"dashed":"solid",title:previewing?`预览${buy?"买":"卖"}`:`挂${buy?"买":"卖"} v${order.strategy_plan_version??"--"}`,axisLabelVisible:true})}
  for(const trade of execution?.trades||[])if(trade.status==="open"&&trade.entry_price)lines.push({price:trade.entry_price,color:"#55a2ff",lineWidth:2,title:"持仓均价"});

}
